<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velox — Repair. Delivered.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#0e0e0e;
    --surface-2:#161616;
    --surface-3:#1c1c1c;
    --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.18);
    --accent:#a8e600;
    --accent-dim:rgba(168,230,0,0.12);
    --accent-ink:#0a1400;
    --text:#f5f5f5;
    --text-secondary:#9aa0a6;
    --text-tertiary:#6b7076;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:22px;
    --radius-pill:999px;
    --shadow-card:0 1px 0 rgba(255,255,255,0.02) inset;
    --ease:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.02em;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;margin:0;padding:0;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  ::selection{background:var(--accent);color:var(--accent-ink);}

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-radius:6px;
  }

  /* ---------- Layout shells ---------- */
  #app{
    min-height:100vh;
    padding-bottom:64px;
  }

  .container{
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    border-radius:var(--radius-pill);
    padding:15px 26px;
    transition:transform .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease), opacity .15s var(--ease);
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .btn-primary:hover{background:#b8fb00;}
  .btn-primary:disabled{
    background:#2a2f1c;
    color:#5c6350;
    cursor:not-allowed;
  }
  .btn-primary:disabled:hover{background:#2a2f1c;}
  .btn-secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border-strong);
  }
  .btn-secondary:hover{border-color:var(--accent); color:var(--accent);}
  .btn-dark{
    background:var(--surface-3);
    color:var(--text);
    border:1px solid var(--border-strong);
  }
  .btn-dark:hover{border-color:var(--accent);}
  .btn-block{width:100%;}
  .btn-sm{padding:10px 18px; font-size:13px;}

  /* ---------- Logo ---------- */
  .logo{display:inline-flex; align-items:center; gap:10px; cursor:pointer;}
  .logo-mark{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-text{display:flex; flex-direction:column; line-height:1;}
  .logo-word{font-size:20px; font-weight:800; letter-spacing:0.02em;}
  .logo-tag{font-size:8px; font-weight:700; letter-spacing:0.18em; color:var(--accent); margin-top:2px;}

  /* ---------- Mode toggle (prototype harness, not product chrome) ---------- */
  .mode-harness{
    position:fixed;
    top:84px; right:18px;
    z-index:1000;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(20,20,20,0.85);
    backdrop-filter:blur(10px);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-pill);
    padding:6px;
  }
  .mode-harness .mh-label{
    font-size:10px;
    color:var(--text-tertiary);
    text-transform:uppercase;
    letter-spacing:0.1em;
    padding-left:10px;
    font-weight:700;
  }
  .mh-btn{
    border:none;
    background:transparent;
    color:var(--text-secondary);
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .mh-btn.active{background:var(--accent); color:var(--accent-ink);}
  .mh-btn:not(.active):hover{color:var(--text);}

  /* ---------- Icon helper ---------- */
  .icon{display:inline-flex; flex-shrink:0;}
  .icon svg{display:block;}

  /* =====================================================
     HOMEPAGE
  ===================================================== */
  .nav{
    position:sticky; top:0; z-index:100;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px;
    max-width:1180px;
    margin:0 auto;
  }
  .nav-links{
    display:flex; gap:34px;
    align-items:center;
  }
  .nav-links a{
    font-size:14px; font-weight:600; color:var(--text-secondary);
    transition:color .15s var(--ease);
  }
  .nav-links a:hover{color:var(--text);}
  .nav-cta{display:flex; align-items:center; gap:14px;}

  .hero{
    padding:96px 32px 80px;
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:56px;
    align-items:center;
  }
  .hero-headline{
    font-size:52px;
    line-height:1.08;
    margin-bottom:22px;
  }
  .hero-headline .accent-text{color:var(--accent);}
  .hero-sub{
    font-size:17px;
    color:var(--text-secondary);
    line-height:1.6;
    max-width:440px;
    margin-bottom:34px;
  }
  .hero-actions{display:flex; gap:14px;}
  .hero-art{
    position:relative;
    border-radius:var(--radius-lg);
    overflow:hidden;
    aspect-ratio:4/3.2;
    background:linear-gradient(160deg,#151a08,#0a0a0a 60%);
    border:1px solid var(--border);
  }
  .hero-art .tech-illustration{
    position:absolute; inset:0;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .hero-badge{
    position:absolute; top:18px; left:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--border-strong);
    backdrop-filter:blur(6px);
    padding:8px 14px;
    border-radius:var(--radius-pill);
    font-size:12px; font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .hero-badge .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}

  .feature-strip{
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:40px 32px;
  }
  .feature-strip-inner{
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns:repeat(4,1fr); gap:24px;
  }
  .feature-item{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    text-align:center;
  }
  .feature-icon-badge{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .feature-item h4{font-size:14px; font-weight:700;}
  .feature-item span{font-size:12px; color:var(--text-tertiary);}

  .section{
    max-width:1180px; margin:0 auto;
    padding:88px 32px;
  }
  .section-head{
    text-align:center;
    margin-bottom:56px;
  }
  .section-head h2{font-size:32px; margin-bottom:12px;}
  .section-head p{color:var(--text-secondary); font-size:15px;}

  .steps-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:20px;
  }
  .step-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:26px 22px;
    position:relative;
    transition:border-color .15s var(--ease), transform .15s var(--ease);
  }
  .step-card:hover{border-color:var(--border-strong); transform:translateY(-2px);}
  .step-card .step-num{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--accent-dim);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px;
    margin-bottom:18px;
  }
  .step-card h4{font-size:16px; margin-bottom:6px;}
  .step-card p{font-size:13px; color:var(--text-tertiary); line-height:1.5;}
  .step-connector{
    position:absolute; top:35px; left:-20px;
    width:20px; height:1px; background:var(--border-strong);
  }

  .why-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:20px;
  }
  .why-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:26px 22px;
    display:flex; flex-direction:column; gap:14px;
    transition:border-color .15s var(--ease), transform .15s var(--ease);
  }
  .why-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .why-card .icon{color:var(--accent);}
  .why-card h4{font-size:15px;}
  .why-card p{font-size:12.5px; color:var(--text-tertiary); line-height:1.5;}

  .footer{
    border-top:1px solid var(--border);
    padding:40px 32px 24px;
    text-align:center;
  }
  .footer p{font-size:12px; color:var(--text-tertiary);}

  @media (max-width:860px){
    .hero{grid-template-columns:1fr; padding-top:56px;}
    .hero-headline{font-size:38px;}
    .feature-strip-inner, .steps-row, .why-grid{grid-template-columns:repeat(2,1fr);}
    .nav-links{display:none;}
  }

  /* =====================================================
     WEB BOOKING FLOW
  ===================================================== */
  .booking-page{
    max-width:1180px; margin:0 auto;
    padding:48px 32px 100px;
  }
  .booking-header{margin-bottom:36px;}
  .booking-header h1{font-size:30px; margin-bottom:8px;}
  .booking-header p{color:var(--text-secondary); font-size:14px;}

  .web-tracker{
    display:flex; align-items:center;
    margin-bottom:44px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .wt-step{
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .wt-dot{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
    border:1.5px solid var(--border-strong);
    color:var(--text-tertiary);
    background:var(--surface);
    transition:all .2s var(--ease);
  }
  .wt-step.done .wt-dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .wt-step.active .wt-dot{border-color:var(--accent); color:var(--accent);}
  .wt-label{font-size:13px; font-weight:700; color:var(--text-tertiary); white-space:nowrap;}
  .wt-step.active .wt-label{color:var(--text);}
  .wt-step.done .wt-label{color:var(--text-secondary);}
  .wt-line{width:48px; height:1.5px; background:var(--border-strong); margin:0 10px; flex-shrink:0;}
  .wt-line.done{background:var(--accent);}

  .booking-grid{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:32px;
    align-items:start;
  }
  .booking-main{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:36px;
    min-height:420px;
    display:flex; flex-direction:column;
  }
  .booking-main h3{font-size:20px; margin-bottom:24px;}
  .booking-main-body{flex:1;}
  .booking-main-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:32px; padding-top:24px;
    border-top:1px solid var(--border);
  }

  .device-grid, .picker-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  }
  .device-card{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:22px 14px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease), transform .1s var(--ease);
    color:var(--text-secondary);
  }
  .device-card:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .device-card.selected{
    border-color:var(--accent);
    background:var(--accent-dim);
    color:var(--text);
  }
  .device-card.selected .icon{color:var(--accent);}
  .device-card span{font-size:13px; font-weight:700;}

  .issue-list, .addr-list, .time-list{
    display:flex; flex-direction:column; gap:10px;
  }
  .row-card{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 18px;
    display:flex; align-items:center; gap:14px;
    cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .row-card:hover{border-color:var(--border-strong);}
  .row-card.selected{border-color:var(--accent); background:var(--accent-dim);}
  .row-card.selected .icon{color:var(--accent);}
  .row-icon{
    width:38px; height:38px; border-radius:10px;
    background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary);
    flex-shrink:0;
  }
  .row-card.selected .row-icon{background:var(--accent-dim); color:var(--accent);}
  .row-text{flex:1;}
  .row-title{font-size:14.5px; font-weight:700;}
  .row-sub{font-size:12px; color:var(--text-tertiary); margin-top:2px;}
  .row-check{color:var(--accent); opacity:0; transition:opacity .15s var(--ease);}
  .row-card.selected .row-check{opacity:1;}
  .row-chevron{color:var(--text-tertiary);}

  /* ---------- Repair center picker ---------- */
  .center-list{display:flex; flex-direction:column; gap:12px;}
  .center-card{
    position:relative;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:17px 18px;
    display:flex; gap:14px; align-items:flex-start;
    cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .center-card:hover{border-color:var(--border-strong);}
  .center-card.selected{border-color:var(--accent); background:var(--accent-dim);}
  .center-logo{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:var(--text-secondary);
    letter-spacing:-0.02em;
  }
  .center-card.selected .center-logo{background:var(--accent-dim); color:var(--accent);}
  .center-main{flex:1; min-width:0; padding-right:26px;}
  .center-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .center-name{font-size:14.5px; font-weight:800;}
  .center-badge{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    background:var(--accent-dim); color:var(--accent);
    padding:3px 8px; border-radius:var(--radius-pill); white-space:nowrap;
  }
  .center-tagline{font-size:12px; color:var(--text-tertiary); margin-top:3px; line-height:1.4;}
  .center-meta{display:flex; align-items:center; gap:12px; margin-top:11px; flex-wrap:wrap;}
  .center-meta-item{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-secondary); font-weight:600;}
  .center-meta-item .icon{color:var(--text-tertiary);}
  .center-meta-item.rating{color:var(--text);}
  .center-meta-item.rating .icon{color:#f5c518;}
  .center-price-row{display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
  .center-price{font-size:14.5px; font-weight:800; color:var(--accent);}
  .center-price-label{font-size:11px; color:var(--text-tertiary);}
  .center-check{position:absolute; top:17px; right:16px; color:var(--accent); opacity:0; transition:opacity .15s var(--ease);}
  .center-card.selected .center-check{opacity:1;}

  textarea.desc-input{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:16px;
    min-height:120px;
    resize:vertical;
    line-height:1.6;
  }
  textarea.desc-input:focus{border-color:var(--accent); outline:none;}
  .field-label{font-size:12px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; display:block;}
  .photo-row{display:flex; gap:10px; margin-top:10px;}
  .photo-thumb, .photo-add{
    width:64px; height:64px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    border:1.5px dashed var(--border-strong);
    color:var(--text-tertiary);
    cursor:pointer;
    background:var(--surface-2);
    flex-shrink:0;
    overflow:hidden;
  }
  .photo-thumb{border-style:solid; border-color:var(--border); background:linear-gradient(135deg,#2a2a2a,#141414); position:relative;}
  .photo-thumb svg{color:#555;}
  .photo-add:hover{border-color:var(--accent); color:var(--accent);}

  .tab-row{display:flex; gap:8px; margin-bottom:20px;}
  .tab-btn{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    color:var(--text-secondary);
    font-weight:700; font-size:13px;
    padding:10px 20px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    transition:all .15s var(--ease);
  }
  .tab-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .tab-btn:not(.active):hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Brand / model picker ---------- */
  .brand-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .brand-card{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 10px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease), transform .1s var(--ease);
    color:var(--text-secondary);
  }
  .brand-card:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .brand-card.selected{border-color:var(--accent); background:var(--accent-dim); color:var(--text);}
  .brand-card.selected .brand-avatar{background:var(--accent-dim); color:var(--accent);}
  .brand-avatar{
    width:38px; height:38px; border-radius:10px;
    background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12.5px; letter-spacing:-0.02em;
  }
  .brand-card span.brand-label{font-size:12.5px; font-weight:700; text-align:center;}
  .section-divider-label{
    font-size:12px; font-weight:700; color:var(--text-tertiary);
    text-transform:uppercase; letter-spacing:0.06em; margin:24px 0 12px;
  }
  .model-search-wrap{position:relative; margin-bottom:12px;}
  .model-search-icon{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); display:flex; pointer-events:none;}
  .model-search-input{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-pill);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:12px 16px 12px 42px;
  }
  .model-search-input::placeholder{color:var(--text-tertiary);}
  .model-search-input:focus{border-color:var(--accent); outline:none;}
  .model-list{display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; padding-right:2px;}
  .model-empty{padding:22px 10px; text-align:center; color:var(--text-tertiary); font-size:13px;}
  @media (max-width:640px){ .brand-grid{grid-template-columns:repeat(3,1fr);} }

  .summary-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:26px;
    position:sticky; top:100px;
  }
  .summary-card h4{font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-tertiary); margin-bottom:18px;}
  .summary-device{
    display:flex; align-items:center; gap:12px;
    padding-bottom:18px; margin-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .summary-device-thumb{
    width:46px; height:46px; border-radius:12px;
    background:var(--accent-dim); color:var(--accent);

// a specific repair center (each center has its own base price).
const CENTER_PRICE_MIN = Math.min(...CENTERS.map(c => c.price));
const CENTER_PRICE_MAX = Math.max(...CENTERS.map(c => c.price));

const DEVICE_NAMES = {

const ISSUE_NAMES = {

const ADDRESS_FULL = '123 Al Maadi St., Maadi, Cairo.';

/* ---------------- Brand / model picker data ---------------- */
// Brand list shown depends on the device chosen in step 1. Phone brands cover
// the mix most commonly seen in the Egyptian market.
const BRANDS_BY_DEVICE = {
  phone: ['samsung','apple','xiaomi','huawei','oppo','infinix','realme','vivo','honor','tecno','nokia','itel'],
  laptop: ['apple','dell','hp','lenovo','asus','acer'],

  watch: ['apple','samsung','huawei','xiaomi','amazfit'],

const BRAND_LABELS = {
  samsung:'Samsung', apple:'Apple', xiaomi:'Xiaomi', huawei:'Huawei', oppo:'Oppo',
  infinix:'Infinix', realme:'Realme', vivo:'Vivo', honor:'Honor', tecno:'Tecno',
  nokia:'Nokia', itel:'itel', dell:'Dell', hp:'HP', lenovo:'Lenovo', asus:'Asus',

// Only phones get a searchable exact-model list, since that's the noisiest
// category in real life (dozens of near-identical model names per brand).
const MODELS_BY_BRAND = {
  samsung: ['Galaxy S24 Ultra','Galaxy S24','Galaxy S23 Ultra','Galaxy S23','Galaxy S23 FE','Galaxy A55','Galaxy A54','Galaxy A34','Galaxy A24','Galaxy A05','Galaxy Z Fold5','Galaxy Z Flip5','Galaxy Note 20 Ultra','Galaxy M14'],

  xiaomi: ['Xiaomi 13T Pro','Xiaomi 13','Redmi Note 13 Pro','Redmi Note 12','Redmi 12','Redmi 10C','POCO X5 Pro','POCO M5'],
  huawei: ['Huawei P60 Pro','Huawei P50 Pro','Huawei Mate 50 Pro','Huawei Nova 11','Huawei Nova 10','Huawei Y9 Prime','Huawei Y7a'],
  oppo: ['Oppo Find X6','Oppo Reno 11','Oppo Reno 10','Oppo A98','Oppo A78','Oppo A58','Oppo A18'],
  infinix: ['Infinix Zero 30','Infinix Note 30','Infinix Note 12','Infinix Hot 40','Infinix Hot 30','Infinix Smart 8','Infinix GT 10 Pro'],

  vivo: ['Vivo V29','Vivo V27','Vivo Y36','Vivo Y17s','Vivo Y02'],

  tecno: ['Tecno Phantom X2','Tecno Camon 20','Tecno Pova 5','Tecno Spark 10'],

  itel: ['itel S23','itel A60','itel P40'],
};

// Brand affects part cost and turnaround, so it nudges the price up or down
// relative to whichever repair center's base price was chosen.
const BRAND_PRICE_MULTIPLIER = {
  samsung:1.15, apple:1.4, xiaomi:0.9, huawei:1.05, oppo:0.9, infinix:0.75,
  realme:0.85, vivo:0.85, honor:0.95, tecno:0.75, nokia:0.8, itel:0.65,
  dell:1.05, hp:1.0, lenovo:0.95, asus:1.0, acer:0.9,
  sony:1.1, microsoft:1.1, nintendo:1.0,
  jbl:1.0, anker:0.9, generic:0.85, amazfit:0.85,
};

const ISSUE_PRICE_ADDON = { screen:150, battery:80, charging:60, camera:100, water:200, other:50 };

function defaultBrandForDevice(device){
  const list = BRANDS_BY_DEVICE[device] || [];
  return list[0] || 'generic';
}
function defaultModelForBrand(brand){
  const list = MODELS_BY_BRAND[brand];
  return list ? list[0] : '';
}
// A rough "flagship" surcharge — Pro/Ultra/Max/foldables typically mean
// pricier screens and parts.
function isFlagshipModel(model){
  return /pro|ultra|max|fold|flip/i.test(model || '');
}

/* ---------------- State ---------------- */
const state = {
  mode: 'web',              // 'web' | 'mobile'
  web: { view: 'home' },    // home | booking | success | track
  webStep: 1,               // 1..8 within booking
  mobileStep: 0,            // 0 = landing, 1..10 (9 = success, 10 = track)
  booking: {
    device: 'phone',
    brand: 'samsung',
    model: defaultModelForBrand('samsung'),
    modelSearch: '',
    issue: 'screen',
    description: 'My screen is cracked and the touch is not working properly.',
    location: 'current',
    center: null,          // chosen repair center id — nothing picked up until the user chooses
    timeTab: 'today',
    time: '05:00 PM',
  },
};

/* ---------------- Helpers ---------------- */
function bookingTitle(){
  return `${deviceDisplayName()} ${ISSUE_NAMES[state.booking.issue]}`;
}
function deviceDisplayName(){
  const brandLabel = BRAND_LABELS[state.booking.brand] || '';
  if (state.booking.device === 'phone') {
    return state.booking.model ? `${brandLabel} ${state.booking.model}` : brandLabel;
  }
  const deviceLabel = (DEVICES.find(d => d.id === state.booking.device) || {}).label || '';
  return `${brandLabel} ${deviceLabel}`.trim();
}
function selectedLocation(){
  return LOCATIONS.find(l => l.id === state.booking.location);
}
function selectedCenter(){
  return CENTERS.find(c => c.id === state.booking.center) || null;
}
function calcPriceForCenter(c){
  const brandMult = BRAND_PRICE_MULTIPLIER[state.booking.brand] || 1;
  const issueAddon = ISSUE_PRICE_ADDON[state.booking.issue] || 0;
  let total = c.price * brandMult + issueAddon;
  if (state.booking.device === 'phone' && isFlagshipModel(state.booking.model)) total += 50;
  return Math.round(total / 5) * 5;
}
function calcTotalPrice(){
  const c = selectedCenter();
  if (!c) return null;
  return calcPriceForCenter(c);
}
function centerPriceLabel(){
  const total = calcTotalPrice();
  return total === null ? '—' : `EGP ${total}`;
}
// Interactive pricing: as soon as brand/model/issue are known we can show a
// live estimate — a range spanning the cheapest to priciest repair center —
// even before a specific center has been chosen. Once a center is chosen the
// estimate collapses into an exact figure.
function calcPriceRange(){
  const brandMult = BRAND_PRICE_MULTIPLIER[state.booking.brand] || 1;
  const issueAddon = ISSUE_PRICE_ADDON[state.booking.issue] || 0;
  let min = CENTER_PRICE_MIN * brandMult + issueAddon;
  let max = CENTER_PRICE_MAX * brandMult + issueAddon;
  if (state.booking.device === 'phone' && isFlagshipModel(state.booking.model)) { min += 50; max += 50; }
  min = Math.round(min / 5) * 5;
  max = Math.round(max / 5) * 5;
  return { min, max };
}
function priceEstimate(){
  const center = selectedCenter();
  if (center) return { label: 'Total', value: `EGP ${calcTotalPrice()}`, exact: true };
  const { min, max } = calcPriceRange();
  const value = min === max ? `EGP ${min}` : `EGP ${min}–${max}`;
  return { label: 'Estimated', value, exact: false };
}
function pricePill(){
  const est = priceEstimate();
  return `<div class="price-pill"><span class="pp-label">${est.exact ? 'Total' : 'Est. Price'}</span><span class="pp-value">${est.value}</span></div>`;
}

/* ---------------- Step sequencing ----------------
   The Model step only exists for phones (that's the only category with a
   searchable exact-model list), so the booking flow is built as an ordered
   list of step ids that's recomputed from the current device — inserting or
   removing 'model' automatically shifts every step after it. */
function getWebStepIds(){
  const ids = ['device','brand'];
  if (state.booking.device === 'phone') ids.push('model');
  ids.push('issue','details','location','center','time','confirm');
  return ids;
}
const WEB_STEP_LABEL_MAP = { device:'Device', brand:'Brand', model:'Model', issue:'Issue', details:'Details', location:'Location', center:'Center', time:'Time', confirm:'Confirm' };
function getWebStepLabels(){
  return getWebStepIds().map(id => WEB_STEP_LABEL_MAP[id]);
}
function getMobileStepIds(){
  return getWebStepIds(); // same underlying sequence (device..confirm)
}
const MOBILE_STEP_LABEL_MAP = { device:'Choose Device', brand:'Choose Brand', model:'Choose Model', issue:'Select Issue', details:'Describe Issue', location:'Choose Location', center:'Choose Center', time:'Choose Time', confirm:'Review & Confirm' };
function getMobileStepLabels(){
  return [...getMobileStepIds().map(id => MOBILE_STEP_LABEL_MAP[id]), 'Booking Successful'];
}
function centerTechnician(){
  const c = selectedCenter();
  return c ? { name: c.tech, rating: c.rating } : { name: 'Technician', rating: '—' };
}
function statusBar(){

}

function render(){
  const app = document.getElementById('app');

  document.getElementById('mh-mobile').classList.toggle('active', state.mode === 'mobile');

  if (state.mode === 'web') {

    else if (state.web.view === 'success') app.innerHTML = renderWebSuccess();
    else if (state.web.view === 'track') app.innerHTML = renderWebTrack();
  } else {

  }
}

/* ================= EVENT HANDLING ================= */
function goWebStep(delta){
  const ids = getWebStepIds();
  const next = state.webStep + delta;
  if (next < 1 || next > ids.length) return;
  const centerStep = ids.indexOf('center') + 1;
  if (delta > 0 && state.webStep === centerStep && !state.booking.center) return; // must choose a repair center first
  state.webStep = next;
  render();
}

function handleAction(action, target){
  switch(action){
    case 'go-home':
      state.mode = 'web'; state.web.view = 'home'; scrollToTop(); break;
    case 'start-booking':
      state.mode = 'web'; state.web.view = 'booking'; state.webStep = 1; scrollToTop(); break;
    case 'go-track':
      state.mode = 'web'; state.web.view = 'track'; scrollToTop(); break;
    case 'web-next':
      goWebStep(1); return;
    case 'web-back':
      goWebStep(-1); return;
    case 'web-jump-confirm':
      if (!state.booking.center) return; // must choose a repair center first
      state.webStep = getWebStepIds().indexOf('confirm') + 1; break;
    case 'confirm-booking':
      if (state.mode === 'web') { state.web.view = 'success'; scrollToTop(); }
      else { state.mobileStep = getMobileStepIds().length + 1; }
      break;
    case 'select-device':
      state.booking.device = target.dataset.value;
      // Switching device categories resets the brand/model pick to a sensible default.
      state.booking.brand = defaultBrandForDevice(state.booking.device);
      state.booking.model = defaultModelForBrand(state.booking.brand);
      state.booking.modelSearch = '';
      break;
    case 'select-brand':
      state.booking.brand = target.dataset.value;
      state.booking.model = defaultModelForBrand(state.booking.brand);
      state.booking.modelSearch = '';
      break;
    case 'select-model':
      state.booking.model = target.dataset.value; break;
    case 'select-issue':
      state.booking.issue = target.dataset.value; break;
    case 'select-location':
      state.booking.location = target.dataset.value; break;
    case 'select-center':
      state.booking.center = target.dataset.value; break;
    case 'select-time':
      state.booking.time = target.dataset.value; break;
    case 'select-time-tab':
      state.booking.timeTab = target.dataset.value; break;
    case 'mobile-start-booking':
      state.mobileStep = 1; break;
    case 'mobile-next': {
      const ids = getMobileStepIds();
      const centerStep = ids.indexOf('center') + 1;
      if (state.mobileStep === centerStep && !state.booking.center) return; // must choose a repair center first
      state.mobileStep = Math.min(ids.length, state.mobileStep + 1);
      // the last step's ("Confirm") button is Confirm Booking, handled by confirm-booking
      break;
    }
    case 'mobile-back':
      state.mobileStep = Math.max(0, state.mobileStep - 1); break;
    case 'mobile-track':
      state.mobileStep = getMobileStepIds().length + 2; break;
    case 'noop-photo':
    case 'noop-address':
      return; // visual-only in this prototype
    default:
      return;
  }
  render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    // nav smooth-scroll links without data-action fall through natively
    return;
  }
  const action = el.dataset.action;
  // Anchor links inside nav (Services/How It Works/Why Velox) still want default scroll behavior
  handleAction(action, el);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    const el = e.target.closest('[role="button"][data-action]');
    if (el) { e.preventDefault(); handleAction(el.dataset.action, el); }
  }
});

document.getElementById('mh-web').addEventListener('click', () => {
  state.mode = 'web';
  scrollToTop();
  render();
});
document.getElementById('mh-mobile').addEventListener('click', () => {
  state.mode = 'mobile';

document.addEventListener('input', (e) => {
  if (e.target.matches('[data-action="update-description"]')) {
    state.booking.description = e.target.value;

  if (e.target.matches('[data-action="update-model-search"]')) {
    state.booking.modelSearch = e.target.value;
    const cursor = e.target.selectionStart;
    render();
    // render() rebuilds the DOM from scratch, which would otherwise drop focus
    // and cursor position out of the search box on every keystroke.
    const input = document.querySelector('[data-action="update-model-search"]');
    if (input) {
      input.focus();
      input.setSelectionRange(cursor, cursor);
    }
  }
});

/* ---------------- Init ---------------- */
render();

</script>
</body>
</html>
