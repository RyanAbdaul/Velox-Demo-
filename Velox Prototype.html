<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velox — Repair. Delivered.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#0e0e0e;
    --surface-2:#161616;
    --surface-3:#1c1c1c;
    --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.18);
    --accent:#a8e600;
    --accent-dim:rgba(168,230,0,0.12);
    --accent-ink:#0a1400;
    --text:#f5f5f5;
    --text-secondary:#9aa0a6;
    --text-tertiary:#6b7076;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:22px;
    --radius-pill:999px;
    --shadow-card:0 1px 0 rgba(255,255,255,0.02) inset;
    --ease:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.02em;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;margin:0;padding:0;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  ::selection{background:var(--accent);color:var(--accent-ink);}

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-radius:6px;
  }

  /* ---------- Layout shells ---------- */
  #app{
    min-height:100vh;
    padding-bottom:64px;
  }

  .container{
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    border-radius:var(--radius-pill);
    padding:15px 26px;
    transition:transform .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease), opacity .15s var(--ease);
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .btn-primary:hover{background:#b8fb00;}
  .btn-primary:disabled{
    background:#2a2f1c;
    color:#5c6350;
    cursor:not-allowed;
  }
  .btn-primary:disabled:hover{background:#2a2f1c;}
  .btn-secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border-strong);
  }
  .btn-secondary:hover{border-color:var(--accent); color:var(--accent);}
  .btn-dark{
    background:var(--surface-3);
    color:var(--text);
    border:1px solid var(--border-strong);
  }
  .btn-dark:hover{border-color:var(--accent);}
  .btn-block{width:100%;}
  .btn-sm{padding:10px 18px; font-size:13px;}

  /* ---------- Logo ---------- */
  .logo{display:inline-flex; align-items:center; gap:10px; cursor:pointer;}
  .logo-mark{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-text{display:flex; flex-direction:column; line-height:1;}
  .logo-word{font-size:20px; font-weight:800; letter-spacing:0.02em;}
  .logo-tag{font-size:8px; font-weight:700; letter-spacing:0.18em; color:var(--accent); margin-top:2px;}

  /* ---------- Mode toggle (prototype harness, not product chrome) ---------- */
  .mode-harness{
    position:fixed;
    bottom:18px; left:50%; transform:translateX(-50%);
    z-index:1000;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(20,20,20,0.85);
    backdrop-filter:blur(10px);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-pill);
    padding:6px;
  }
  .mode-harness .mh-label{
    font-size:10px;
    color:var(--text-tertiary);
    text-transform:uppercase;
    letter-spacing:0.1em;
    padding-left:10px;
    font-weight:700;
  }
  .mh-btn{
    border:none;
    background:transparent;
    color:var(--text-secondary);
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .mh-btn.active{background:var(--accent); color:var(--accent-ink);}
  .mh-btn:not(.active):hover{color:var(--text);}

  /* ---------- Icon helper ---------- */
  .icon{display:inline-flex; flex-shrink:0;}
  .icon svg{display:block;}

  /* =====================================================
     HOMEPAGE
  ===================================================== */
  .nav{
    position:sticky; top:0; z-index:100;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px;
    max-width:1180px;
    margin:0 auto;
  }
  .nav-links{
    display:flex; gap:34px;
    align-items:center;
  }
  .nav-links a{
    font-size:14px; font-weight:600; color:var(--text-secondary);
    transition:color .15s var(--ease);
  }
  .nav-links a:hover{color:var(--text);}
  .nav-cta{display:flex; align-items:center; gap:14px;}

  .hero{
    padding:96px 32px 80px;
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:56px;
    align-items:center;
  }
  .hero-headline{
    font-size:52px;
    line-height:1.08;
    margin-bottom:22px;
  }
  .hero-headline .accent-text{color:var(--accent);}
  .hero-sub{
    font-size:17px;
    color:var(--text-secondary);
    line-height:1.6;
    max-width:440px;
    margin-bottom:34px;
  }
  .hero-actions{display:flex; gap:14px;}
  .hero-art{
    position:relative;
    border-radius:var(--radius-lg);
    overflow:hidden;
    aspect-ratio:4/3.2;
    background:linear-gradient(160deg,#151a08,#0a0a0a 60%);
    border:1px solid var(--border);
  }
  .hero-art .tech-illustration{
    position:absolute; inset:0;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .hero-badge{
    position:absolute; top:18px; left:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--border-strong);
    backdrop-filter:blur(6px);
    padding:8px 14px;
    border-radius:var(--radius-pill);
    font-size:12px; font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .hero-badge .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}

  .feature-strip{
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:40px 32px;
  }
  .feature-strip-inner{
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns:repeat(4,1fr); gap:24px;
  }
  .feature-item{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    text-align:center;
  }
  .feature-icon-badge{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .feature-item h4{font-size:14px; font-weight:700;}
  .feature-item span{font-size:12px; color:var(--text-tertiary);}

  .section{
    max-width:1180px; margin:0 auto;
    padding:88px 32px;
  }
  .section-head{
    text-align:center;
    margin-bottom:56px;
  }
  .section-head h2{font-size:32px; margin-bottom:12px;}
  .section-head p{color:var(--text-secondary); font-size:15px;}

  .steps-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:20px;
  }
  .step-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:26px 22px;
    position:relative;
    transition:border-color .15s var(--ease), transform .15s var(--ease);
  }
  .step-card:hover{border-color:var(--border-strong); transform:translateY(-2px);}
  .step-card .step-num{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--accent-dim);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px;
    margin-bottom:18px;
  }
  .step-card h4{font-size:16px; margin-bottom:6px;}
  .step-card p{font-size:13px; color:var(--text-tertiary); line-height:1.5;}
  .step-connector{
    position:absolute; top:35px; left:-20px;
    width:20px; height:1px; background:var(--border-strong);
  }

  .why-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:20px;
  }
  .why-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:26px 22px;
    display:flex; flex-direction:column; gap:14px;
    transition:border-color .15s var(--ease), transform .15s var(--ease);
  }
  .why-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .why-card .icon{color:var(--accent);}
  .why-card h4{font-size:15px;}
  .why-card p{font-size:12.5px; color:var(--text-tertiary); line-height:1.5;}

  .footer{
    border-top:1px solid var(--border);
    padding:40px 32px 24px;
    text-align:center;
  }
  .footer p{font-size:12px; color:var(--text-tertiary);}

  @media (max-width:860px){
    .hero{grid-template-columns:1fr; padding-top:56px;}
    .hero-headline{font-size:38px;}
    .feature-strip-inner, .steps-row, .why-grid{grid-template-columns:repeat(2,1fr);}
    .nav-links{display:none;}
  }

  /* =====================================================
     WEB BOOKING FLOW
  ===================================================== */
  .booking-page{
    max-width:1180px; margin:0 auto;
    padding:48px 32px 100px;
  }
  .booking-header{margin-bottom:36px;}
  .booking-header h1{font-size:30px; margin-bottom:8px;}
  .booking-header p{color:var(--text-secondary); font-size:14px;}

  .web-tracker{
    display:flex; align-items:center;
    margin-bottom:44px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .wt-step{
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .wt-dot{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
    border:1.5px solid var(--border-strong);
    color:var(--text-tertiary);
    background:var(--surface);
    transition:all .2s var(--ease);
  }
  .wt-step.done .wt-dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .wt-step.active .wt-dot{border-color:var(--accent); color:var(--accent);}
  .wt-label{font-size:13px; font-weight:700; color:var(--text-tertiary); white-space:nowrap;}
  .wt-step.active .wt-label{color:var(--text);}
  .wt-step.done .wt-label{color:var(--text-secondary);}
  .wt-line{width:48px; height:1.5px; background:var(--border-strong); margin:0 10px; flex-shrink:0;}
  .wt-line.done{background:var(--accent);}

  .booking-grid{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:32px;
    align-items:start;
  }
  .booking-main{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:36px;
    min-height:420px;
    display:flex; flex-direction:column;
  }
  .booking-main h3{font-size:20px; margin-bottom:24px;}
  .booking-main-body{flex:1;}
  .booking-main-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:32px; padding-top:24px;
    border-top:1px solid var(--border);
  }

  .device-grid, .picker-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  }
  .device-card{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:22px 14px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease), transform .1s var(--ease);
    color:var(--text-secondary);
  }
  .device-card:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .device-card.selected{
    border-color:var(--accent);
    background:var(--accent-dim);
    color:var(--text);
  }
  .device-card.selected .icon{color:var(--accent);}
  .device-card span{font-size:13px; font-weight:700;}

  .issue-list, .addr-list, .time-list{
    display:flex; flex-direction:column; gap:10px;
  }
  .row-card{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 18px;
    display:flex; align-items:center; gap:14px;
    cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .row-card:hover{border-color:var(--border-strong);}
  .row-card.selected{border-color:var(--accent); background:var(--accent-dim);}
  .row-card.selected .icon{color:var(--accent);}
  .row-icon{
    width:38px; height:38px; border-radius:10px;
    background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary);
    flex-shrink:0;
  }
  .row-card.selected .row-icon{background:var(--accent-dim); color:var(--accent);}
  .row-text{flex:1;}
  .row-title{font-size:14.5px; font-weight:700;}
  .row-sub{font-size:12px; color:var(--text-tertiary); margin-top:2px;}
  .row-check{color:var(--accent); opacity:0; transition:opacity .15s var(--ease);}
  .row-card.selected .row-check{opacity:1;}
  .row-chevron{color:var(--text-tertiary);}

  textarea.desc-input{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:16px;
    min-height:120px;
    resize:vertical;
    line-height:1.6;
  }
  textarea.desc-input:focus{border-color:var(--accent); outline:none;}
  .field-label{font-size:12px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; display:block;}
  .photo-row{display:flex; gap:10px; margin-top:10px;}
  .photo-thumb, .photo-add{
    width:64px; height:64px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    border:1.5px dashed var(--border-strong);
    color:var(--text-tertiary);
    cursor:pointer;
    background:var(--surface-2);
    flex-shrink:0;
    overflow:hidden;
  }
  .photo-thumb{border-style:solid; border-color:var(--border); background:linear-gradient(135deg,#2a2a2a,#141414); position:relative;}
  .photo-thumb svg{color:#555;}
  .photo-add:hover{border-color:var(--accent); color:var(--accent);}

  .tab-row{display:flex; gap:8px; margin-bottom:20px;}
  .tab-btn{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    color:var(--text-secondary);
    font-weight:700; font-size:13px;
    padding:10px 20px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    transition:all .15s var(--ease);
  }
  .tab-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .tab-btn:not(.active):hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Brand / model picker ---------- */
  .brand-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .brand-card{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 10px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease), transform .1s var(--ease);
    color:var(--text-secondary);
  }
  .brand-card:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .brand-card.selected{border-color:var(--accent); background:var(--accent-dim); color:var(--text);}
  .brand-card.selected .brand-avatar{background:var(--accent-dim); color:var(--accent);}
  .brand-avatar{
    width:38px; height:38px; border-radius:10px;
    background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12.5px; letter-spacing:-0.02em;
  }
  .brand-card span.brand-label{font-size:12.5px; font-weight:700; text-align:center;}
  .section-divider-label{
    font-size:12px; font-weight:700; color:var(--text-tertiary);
    text-transform:uppercase; letter-spacing:0.06em; margin:24px 0 12px;
  }
  .model-search-wrap{position:relative; margin-bottom:12px;}
  .model-search-icon{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); display:flex; pointer-events:none;}
  .model-search-input{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-pill);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:12px 16px 12px 42px;
  }
  .model-search-input::placeholder{color:var(--text-tertiary);}
  .model-search-input:focus{border-color:var(--accent); outline:none;}
  .model-list{display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; padding-right:2px;}
  .model-empty{padding:22px 10px; text-align:center; color:var(--text-tertiary); font-size:13px;}
  .price-tag-inline{font-size:11.5px; font-weight:700; color:var(--accent);}
  @media (max-width:640px){ .brand-grid{grid-template-columns:repeat(3,1fr);} }

  .summary-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:26px;
    position:sticky; top:100px;
  }
  .summary-card h4{font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-tertiary); margin-bottom:18px;}
  .summary-device{
    display:flex; align-items:center; gap:12px;
    padding-bottom:18px; margin-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .summary-device-thumb{
    width:46px; height:46px; border-radius:12px;
    background:var(--accent-dim); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .summary-device-name{font-size:14.5px; font-weight:700;}
  .summary-device-sub{font-size:12px; color:var(--text-tertiary); margin-top:2px;}
  .summary-rows{display:flex; flex-direction:column; gap:14px; margin-bottom:20px;}
  .summary-row{display:flex; justify-content:space-between; gap:12px; font-size:13px;}
  .summary-row-label{color:var(--text-tertiary); flex-shrink:0;}
  .summary-row-value{color:var(--text); text-align:right; font-weight:600;}
  .summary-total{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:18px; border-top:1px solid var(--border);
    margin-bottom:22px;
  }
  .summary-total-label{font-size:13px; color:var(--text-tertiary);}
  .summary-total-value{font-size:22px; font-weight:800; color:var(--accent);}

  @media (max-width:900px){
    .booking-grid{grid-template-columns:1fr;}
    .summary-card{position:static;}
    .device-grid, .picker-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* =====================================================
     SUCCESS / TRACK (web variant)
  ===================================================== */
  .web-result{
    max-width:560px; margin:60px auto; padding:0 32px;
    text-align:center;
  }
  .success-badge{
    width:96px; height:96px; border-radius:50%;
    background:var(--accent-dim); border:2px solid var(--accent);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 28px;
  }
  .web-result h1{font-size:28px; margin-bottom:10px;}
  .web-result > p{color:var(--text-secondary); font-size:15px; margin-bottom:32px;}

  .time-pill{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border-strong);
    padding:14px 24px; border-radius:var(--radius-pill);
    font-weight:700; color:var(--accent);
    margin-bottom:28px;
  }
  .tech-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:18px 20px;
    text-align:left; margin-bottom:28px;
  }
  .tech-avatar{
    width:52px; height:52px; border-radius:50%;

// Base callout-visit price per device category, before brand/issue adjustments.
const DEVICE_BASE_PRICE = { phone:250, laptop:450, tablet:350, watch:200, console:320, accessories:150 };

// Brand affects part cost and turnaround, so it nudges the price up or down.
const BRAND_PRICE_MULTIPLIER = {
  samsung:1.15, apple:1.4, xiaomi:0.9, huawei:1.05, oppo:0.9, infinix:0.75,
  realme:0.85, vivo:0.85, honor:0.95, tecno:0.75, nokia:0.8, itel:0.65,

};

const ISSUE_PRICE_ADDON = { screen:150, battery:80, charging:60, camera:100, water:200, other:50 };

function defaultBrandForDevice(device){
  const list = BRANDS_BY_DEVICE[device] || [];
  return list[0] || 'generic';
}
function defaultModelForBrand(brand){
  const list = MODELS_BY_BRAND[brand];
  return list ? list[0] : '';
}
// A rough "flagship" surcharge — Pro/Ultra/Max/foldables typically mean
// pricier screens and parts.
function isFlagshipModel(model){
  return /pro|ultra|max|fold|flip/i.test(model || '');
}
function calcTotalPrice(){
  const base = DEVICE_BASE_PRICE[state.booking.device] || 250;
  const brandMult = BRAND_PRICE_MULTIPLIER[state.booking.brand] || 1;
  const issueAddon = ISSUE_PRICE_ADDON[state.booking.issue] || 0;
  let total = base * brandMult + issueAddon;
  if (state.booking.device === 'phone' && isFlagshipModel(state.booking.model)) total += 50;
  total = Math.round(total / 5) * 5;
  return total + (state.booking.urgent ? URGENT_FEE : 0);
}
const URGENT_FEE = 100;
function loyaltyPoints(){ return Math.floor(calcTotalPrice() / 10); }
function dayLabel(){ return { today:'Today', tomorrow:'Tomorrow', schedule:'Mon, 12 Oct' }[state.booking.timeTab]; }
function whenLabel(){ return state.booking.urgent ? 'ASAP, within 60 min' : `${dayLabel()}, ${state.booking.time}`; }
function breakdownRows(){
  const u = state.booking.urgent;

  return row('Repair', `EGP ${calcTotalPrice() - (u ? URGENT_FEE : 0)}`) + (u ? row('Hurry-up fee', `EGP ${URGENT_FEE}`) : '') + row('Points earned', `+${loyaltyPoints()} pts`, 'var(--accent)');
}
function priceLabel(){
  return `EGP ${calcTotalPrice()}`;
}

}

/* ---------------- Step sequencing ----------------
   The Model step only exists for phones (that's the only category with a
   searchable exact-model list), so the booking flow is built as an ordered
   list of step ids that's recomputed from the current device — inserting or
   removing 'model' automatically shifts every step after it. */
function getWebStepIds(){
  const ids = ['device','brand'];
  if (state.booking.device === 'phone') ids.push('model');
  ids.push('issue','details','location','time','confirm');
  return ids;
}
const WEB_STEP_LABEL_MAP = { device:'Device', brand:'Brand', model:'Model', issue:'Issue', details:'Details', location:'Location', time:'Time', confirm:'Confirm' };
function getWebStepLabels(){
  return getWebStepIds().map(id => WEB_STEP_LABEL_MAP[id]);
}
function getMobileStepIds(){
  return getWebStepIds(); // same underlying sequence (device..confirm)
}
const MOBILE_STEP_LABEL_MAP = { device:'Choose Device', brand:'Choose Brand', model:'Choose Model', issue:'Select Issue', details:'Describe Issue', location:'Choose Location', time:'Choose Time', confirm:'Review & Confirm' };
function getMobileStepLabels(){
  return [...getMobileStepIds().map(id => MOBILE_STEP_LABEL_MAP[id]), 'Booking Successful'];
}

function render(){
  const app = document.getElementById('app');

  document.getElementById('mh-mobile').classList.toggle('active', state.mode === 'mobile');
  document.getElementById('mh-tech').classList.toggle('active', state.mode === 'tech');

  if (state.mode === 'web') {
    if (state.web.view === 'home') app.innerHTML = renderHomepage();
    else if (state.web.view === 'booking') app.innerHTML = renderWebBooking();
    else if (state.web.view === 'success') app.innerHTML = renderWebSuccess();
    else if (state.web.view === 'track') app.innerHTML = renderWebTrack();
    else if (state.web.view === 'partner') app.innerHTML = renderWebPartner();
    else if (state.web.view === 'signup') app.innerHTML = renderWebSignup();
  } else if (state.mode === 'tech') {
    app.innerHTML = renderTechShell();
  } else {
    app.innerHTML = renderMobileShell();
  }
}

function webTracker(){

      const stepNum = i + 1;
      const cls = stepNum < state.webStep ? 'done' : stepNum === state.webStep ? 'active' : '';

      const line = i < labels.length - 1 ? `<div class="wt-line ${stepNum < state.webStep ? 'done' : ''}"></div>` : '';
      return `<div class="wt-step ${cls}">

        <span class="wt-label">${label}</span>
      </div>${line}`;
    }).join('')}
  </div>`;
}

function webStepBody(){
  const ids = getWebStepIds();
  const id = ids[state.webStep - 1];
  switch(id){
    case 'device': return stepDeviceBody(false);
    case 'brand': return stepBrandBody(false);
    case 'model': return stepModelBody(false);
    case 'issue': return stepIssueBody(false);
    case 'details': return stepDetailsBody(false);

    case 'time': return stepTimeBody(false);

}

// Dedicated model/version step — phone-only. Kept separate from brand
// selection so the brand grid (a visual pick) and the model search (a text
// lookup) aren't competing for attention on the same screen.
function stepModelBody(isMobile){
  const brandLabel = BRAND_LABELS[state.booking.brand] || '';
  const allModels = MODELS_BY_BRAND[state.booking.brand] || [];
  const q = state.booking.modelSearch.trim().toLowerCase();
  const filtered = q ? allModels.filter(m => m.toLowerCase().includes(q)) : allModels;
  const modelRows = filtered.map(m => `
    <div class="row-card ${state.booking.model === m ? 'selected' : ''}"
         data-action="select-model" data-value="${m}" tabindex="0" role="button"
         aria-pressed="${state.booking.model === m}" style="justify-content:space-between;">
      <div class="row-title">${m}</div>
      <span class="row-check" style="opacity:${state.booking.model === m ? 1 : 0}">${icon('check', 16)}</span>
    </div>`).join('');
  const body = `
    <div class="model-search-wrap">
      <span class="model-search-icon">${icon('search', 16)}</span>
      <input class="model-search-input" type="text" data-action="update-model-search"
             placeholder="Search ${brandLabel} models…" value="${state.booking.modelSearch}">
    </div>
    <div class="model-list">
      ${modelRows || `<div class="model-empty">No model matches "${state.booking.modelSearch}"</div>`}
    </div>`;

  if (isMobile) {
    return `
      <h2 class="screen-title">Which ${brandLabel} exactly?</h2>
      <div class="screen-body">${body}</div>
      <div class="m-footer">
        <button class="btn btn-primary btn-block" data-action="mobile-next">Next</button>

const sform = { name:'', phone:'' };
const apply = { step:0, err:'', f:{ name:'', phone:'', area:'', addr:'', ecName:'', ecPhone:'', exp:'1–3 years', skills:[], brands:[], tools:'Yes', ride:'Motorbike', docs:{}, payout:'Vodafone Cash', acct:'', agree:false } };
const DOCS = [
  { id:'photo', label:'Personal photo', sub:'Clear, face visible', req:1, icon:'user' },
  { id:'idf', label:'National ID, front', sub:'All four corners visible', req:1, icon:'camera' },
  { id:'idb', label:'National ID, back', sub:'All four corners visible', req:1, icon:'camera' },
  { id:'birth', label:'Birth certificate', sub:'Original copy', req:1, icon:'shieldCheck' },
  { id:'crim', label:'Criminal record certificate', sub:'Issued in the last 3 months', req:1, icon:'shieldCheck' },
  { id:'mil', label:'Military service status', sub:'Men only', req:0, icon:'award' },
  { id:'cert', label:'CV or training certificate', sub:'Optional, helps you get approved faster', req:0, icon:'award' },
];
const APPLY_SKILLS = ['Screens','Batteries','Charging ports','Cameras','Water damage','Micro-soldering'];
const APPLY_BRANDS = ['Apple','Samsung','Xiaomi','Huawei','Oppo','Infinix'];
const PHONE_RE = /^01[0125]\d{8}$/;

function applyError(step){
  const f = apply.f;
  if (step === 1) {
    if (f.name.trim().length < 2 || !f.area.trim() || !f.addr.trim()) return 'Fill in your name, area and home address.';
    if (!PHONE_RE.test(f.phone.trim())) return 'Enter a valid Egyptian mobile number, 11 digits (010XXXXXXXX).';
    if (f.ecPhone.trim() && !PHONE_RE.test(f.ecPhone.trim())) return 'Emergency contact number must be 11 digits.';
  }
  if (step === 2 && !f.skills.length) return 'Pick at least one repair skill.';
  if (step === 3 && DOCS.some(d => d.req && !f.docs[d.id])) return 'Upload all required documents.';
  if (step === 4) {
    if (f.acct.trim().length < 6) return 'Enter your wallet or account number.';
    if (!f.agree) return 'Accept the terms to submit.';
  }
  return '';
}
const fld = (label, scope, key, val, ph, type='text') => `<label class="field-label">${label}</label><input class="fld" type="${type}" data-field="${scope}.${key}" placeholder="${ph}" value="${esc(val)}" ${type === 'tel' ? 'inputmode="tel"' : ''}>`;
const chips = (key, opts, multi) => `<div class="chips">${opts.map(o => { const on = multi ? apply.f[key].includes(o) : apply.f[key] === o; return `<button class="tab-btn ${on ? 'active' : ''}" data-action="${multi ? 'apply-toggle' : 'apply-set'}" data-key="${key}" data-value="${o}">${o}</button>`; }).join('')}</div>`;
const errLine = m => m ? `<div class="err" role="alert">${m}</div>` : '';

    <div class="row-card" data-action="auth-go-tech" role="button" tabindex="0" style="width:100%;text-align:left;"><div class="row-icon">${icon('wrench', 18)}</div><div class="row-text"><div class="row-title">I'm a technician</div><div class="row-sub">Apply to join the Velox team</div></div><span class="row-chevron">${icon('chevronRight', 16)}</span></div>
    <button class="btn btn-secondary btn-block btn-sm" data-action="auth-login" style="margin-top:18px;">I already have an account</button>
  </div>`;
}
function signupBody(){

function techApplyScreen(){

  if (auth.techStatus === 'review') return `<div class="m-success">
    <div class="m-success-icon">${icon('checkCircle', 36)}</div>
    <h2>Application received</h2><p>We usually reply within 48 hours.</p>
    <div class="timeline" style="width:100%;margin-bottom:22px;">${[['Application submitted','done'],['Documents check','active'],['Phone interview',''],['Approved','']].map(([t, c]) => `<div class="tl-item ${c}"><div class="tl-line"></div><div class="tl-dot">${c === 'done' ? icon('check', 11) : ''}</div><div class="tl-content"><div class="tl-title">${t}</div></div></div>`).join('')}</div>

  </div>`;
  if (st === 0) return `<div class="m-landing">
    <div class="m-landing-logo">${logoMark(36)}</div>
    <div class="m-landing-illustration">${icon('wrench', 40)}</div>
    <h2>Work with <span class="accent-text">Velox</span></h2>
    <p>Get repair requests near you, keep 85% of every job and settle once a month.</p>
    <button class="btn btn-primary btn-block" data-action="apply-start">Start application</button>

  const titles = ['', 'About you', 'Your experience', 'Documents', 'Payout and review'];
  let body = '';
  if (st === 1) body = `${fld('Full name (as on your ID)', 'apply', 'name', f.name, 'Full name')}${fld('Mobile number', 'apply', 'phone', f.phone, '010XXXXXXXX', 'tel')}${fld('Area you live in', 'apply', 'area', f.area, 'e.g. Maadi, Cairo')}${fld('Home address', 'apply', 'addr', f.addr, 'Street, building, floor')}${fld('Emergency contact name (optional)', 'apply', 'ecName', f.ecName, 'Name')}${fld('Emergency contact number (optional)', 'apply', 'ecPhone', f.ecPhone, '010XXXXXXXX', 'tel')}`;
  if (st === 2) body = `<span class="field-label">Years of experience</span>${chips('exp', ['Under 1 year','1–3 years','3–5 years','5+ years'])}<span class="field-label">What do you repair?</span>${chips('skills', APPLY_SKILLS, true)}<span class="field-label">Brands you know best</span>${chips('brands', APPLY_BRANDS, true)}<span class="field-label">Do you own repair tools?</span>${chips('tools', ['Yes','Not yet'])}<span class="field-label">How do you get around?</span>${chips('ride', ['Motorbike','Car','Public transport'])}`;
  if (st === 3) body = `<p class="screen-sub" style="margin:0 0 14px;">Prototype only. Nothing is really uploaded.</p><div class="m-row-list">${DOCS.map(d => `<div class="row-card ${f.docs[d.id] ? 'selected' : ''}" data-action="apply-doc" data-id="${d.id}" role="button" tabindex="0"><div class="row-icon">${icon(d.icon, 18)}</div><div class="row-text"><div class="row-title">${d.label}${d.req ? '' : ' (optional)'}</div><div class="row-sub">${d.sub}</div></div>${f.docs[d.id] ? `<span class="doc-state">${icon('check', 13)} Added</span>` : '<span class="doc-state todo">Upload</span>'}</div>`).join('')}</div>`;
  if (st === 4) body = `<span class="field-label">How should we pay you?</span>${chips('payout', ['Vodafone Cash','InstaPay','Bank account'])}${fld('Wallet or account number', 'apply', 'acct', f.acct, 'Number')}
    <div class="row-card ${f.agree ? 'selected' : ''}" data-action="apply-agree" role="button" tabindex="0" style="margin-bottom:14px;"><div class="row-text"><div class="row-title" style="font-size:13px;">I agree to the terms</div><div class="row-sub">I collect payments from customers and Velox's 15% is settled at the end of each month.</div></div><span class="row-check">${icon('check', 16)}</span></div>`;
  return `<div class="screen-header">${backBtn('apply-back')}<div class="pbar"><div><i style="width:${st * 25}%"></i></div>Step ${st} of 4</div></div>

    <div class="m-footer"><button class="btn btn-primary btn-block" data-action="apply-next">${st === 4 ? 'Submit application' : 'Next'}</button></div>`;
}

/* ================= EVENT HANDLING ================= */
function goWebStep(delta){
  const ids = getWebStepIds();
  const next = state.webStep + delta;
  if (next < 1 || next > ids.length) return;
  state.webStep = next;
  render();
}

function handleAction(action, target){
  switch(action){
    case 'go-home':
      state.mode = 'web'; state.web.view = 'home'; scrollToTop(); break;
    case 'start-booking':
      state.mode = 'web'; state.web.view = auth.customer ? 'booking' : 'signup'; state.webStep = 1; scrollToTop(); break;
    case 'go-track':
      state.mode = 'web'; state.web.view = 'track'; scrollToTop(); break;
    case 'web-next':
      goWebStep(1); return;
    case 'web-back':
      goWebStep(-1); return;
    case 'web-jump-confirm':
      state.webStep = getWebStepIds().indexOf('confirm') + 1; break;
    case 'confirm-booking':
      addBookingAsJob();
      if (state.mode === 'web') { state.web.view = 'success'; scrollToTop(); }
      else { state.mobileStep = getMobileStepIds().length + 1; }
      break;
    case 'select-device':
      state.booking.device = target.dataset.value;
      // Switching device categories resets the brand/model pick to a sensible default.
      state.booking.brand = defaultBrandForDevice(state.booking.device);
      state.booking.model = defaultModelForBrand(state.booking.brand);
      state.booking.modelSearch = '';
      break;
    case 'select-brand':
      state.booking.brand = target.dataset.value;
      state.booking.model = defaultModelForBrand(state.booking.brand);
      state.booking.modelSearch = '';
      break;
    case 'select-model':
      state.booking.model = target.dataset.value; break;
    case 'select-issue':
      state.booking.issue = target.dataset.value; break;
    case 'select-location':
      state.booking.location = target.dataset.value; break;
    case 'select-time':
      state.booking.time = target.dataset.value; state.booking.urgent = false; break;
    case 'select-time-tab':
      state.booking.timeTab = target.dataset.value; state.booking.urgent = false; break;
    case 'toggle-urgent':
      state.booking.urgent = !state.booking.urgent; break;
    case 'go-partner':
      state.mode = 'web'; state.web.view = 'partner'; scrollToTop(); break;
    case 'mobile-start-booking':
      state.mobileStep = 1; break;
    case 'mobile-next':
      state.mobileStep = Math.min(getMobileStepIds().length, state.mobileStep + 1);
      // the last step's ("Confirm") button is Confirm Booking, handled by confirm-booking
      break;
    case 'mobile-back':
      state.mobileStep = Math.max(0, state.mobileStep - 1); break;
    case 'mobile-track':
      state.mobileStep = getMobileStepIds().length + 2; break;
    case 'tech-tab': tech.tab = target.dataset.value; break;
    case 'tech-toggle': tech.online = !tech.online; break;
    case 'tech-open': tech.open = target.dataset.id; break;
    case 'tech-back': { const j = jobById(tech.open); if (j) tech.tab = tabOf(j); tech.open = null; break; }
    case 'tech-decline': tech.jobs = tech.jobs.filter(j => j.id !== target.dataset.id); break;
    case 'tech-accept': { const j = jobById(target.dataset.id); j.stage = 1; tech.tab = 'active'; break; }
    case 'tech-advance': { const j = jobById(tech.open); j.stage = Math.min(5, j.stage + 1); break; }
    case 'auth-customer': auth.view = 'signup'; auth.err = ''; break;
    case 'auth-back': auth.view = 'welcome'; auth.err = ''; break;
    case 'auth-go-tech': state.mode = 'tech'; tech.open = null; scrollToTop(); break;
    case 'signup-submit':
      if (sform.name.trim().length < 2) { auth.err = 'Enter your name.'; break; }
      if (!/^01[0125]\d{8}$/.test(sform.phone.trim())) { auth.err = 'Enter a valid Egyptian mobile number, 11 digits (010XXXXXXXX).'; break; }
      { const ph = sform.phone.trim(); let acc = auth.accounts.find(a => a.phone === ph);
        if (!acc) { acc = { name: sform.name.trim(), phone: ph }; auth.accounts.push(acc); }
        auth.customer = acc; auth.err = ''; }
      if (state.mode === 'web') { state.web.view = 'booking'; state.webStep = 1; scrollToTop(); }
      break;
    case 'auth-login': auth.view = 'login'; auth.err = ''; break;
    case 'auth-logout': auth.customer = null; auth.view = 'welcome'; sform.name = ''; sform.phone = ''; break;
    case 'login-submit': {
      const ph = sform.phone.trim(), acc = auth.accounts.find(a => a.phone === ph);
      if (!PHONE_RE.test(ph)) { auth.err = 'Enter a valid Egyptian mobile number, 11 digits (010XXXXXXXX).'; break; }
      if (!acc) { auth.err = 'No account with this number. Sign up first.'; break; }
      auth.customer = acc; auth.err = '';
      if (state.mode === 'web') { state.web.view = 'booking'; state.webStep = 1; scrollToTop(); }
      break; }
    case 'apply-start': apply.step = 1; apply.err = ''; break;
    case 'apply-back': apply.step = Math.max(0, apply.step - 1); apply.err = ''; break;
    case 'apply-next': {
      const e = applyError(apply.step); apply.err = e;
      if (!e) { if (apply.step === 4) auth.techStatus = 'review'; else apply.step++; }
      break; }
    case 'apply-set': apply.f[target.dataset.key] = target.dataset.value; break;
    case 'apply-toggle': { const a = apply.f[target.dataset.key], v = target.dataset.value; apply.f[target.dataset.key] = a.includes(v) ? a.filter(x => x !== v) : [...a, v]; break; }
    case 'apply-doc': apply.f.docs[target.dataset.id] = !apply.f.docs[target.dataset.id]; break;
    case 'apply-agree': apply.f.agree = !apply.f.agree; break;
    case 'tech-approve': case 'tech-demo-login': auth.techStatus = 'approved'; tech.open = null; break;
    case 'noop-photo':
    case 'noop-address':
      return; // visual-only in this prototype
    default:
      return;
  }
  render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    // nav smooth-scroll links without data-action fall through natively
    return;
  }
  const action = el.dataset.action;
  // Anchor links inside nav (Services/How It Works/Why Velox) still want default scroll behavior
  handleAction(action, el);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    const el = e.target.closest('[role="button"][data-action]');
    if (el) { e.preventDefault(); handleAction(el.dataset.action, el); }
  }
});

document.getElementById('mh-web').addEventListener('click', () => {
  state.mode = 'web';
  scrollToTop();
  render();
});
document.getElementById('mh-tech').addEventListener('click', () => {
  state.mode = 'tech'; tech.open = null;
  scrollToTop();
  render();
});
document.getElementById('mh-mobile').addEventListener('click', () => {
  state.mode = 'mobile';
  state.mobileStep = 0;
  scrollToTop();
  render();
});

document.addEventListener('input', (e) => {
  if (e.target.dataset.field) {
    const [sc, k] = e.target.dataset.field.split('.');
    ({ apply: apply.f, sform })[sc][k] = e.target.value;
  } else if (e.target.matches('[data-action="update-description"]')) {
    state.booking.description = e.target.value;
  } else if (e.target.matches('[data-action="update-model-search"]')) {
    state.booking.modelSearch = e.target.value;
    const caret = e.target.selectionStart;
    render();
    const input = document.querySelector('[data-action="update-model-search"]');
    if (input) {
      input.focus();
      try { input.setSelectionRange(caret, caret); } catch (err) {}
    }
  }
});

/* ---------------- Init ---------------- */
render();

</script>
